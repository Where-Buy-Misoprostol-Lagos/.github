# One campaign = one config file. Copy to config.toml and edit.
# Example: scheduling software sold to HVAC companies in Texas.

[market]
# Businesses pick their own Google category, so list every name the market uses.
categories = ["hvac contractor", "air conditioning contractor", "heating contractor", "hvac company"]
country = "us"      # Google country code
language = "en"

[areas]
# "postal": one search per postal code.  Create the file with:
#     python -m maps_leads zips US
mode = "postal"
file = "postal_us.csv"
regions = ["Texas"]          # optional filter on the file's region/state column

# "grid": one search per map cell, for countries without usable postal codes.
# mode = "grid"
# bbox = [6.39, 3.10, 6.70, 3.70]   # south, west, north, east  (this box is Lagos)
# cell_km = 3.0                      # smaller cells in dense cities
zoom = 13

[scrape]
max_pages = 3                # result pages per query (20 results each)
workers = 8
cost_per_1k_searches = 1.0   # your Serper rate, used for the estimate only

[qualify]
require_website = true
min_reviews = 10
min_rating = 0.0
max_rating = 5.0
max_locations = 3            # cut chains; 0 disables
category_keywords = ["hvac", "air conditioning", "heating"]
exclude_name_keywords = ["home depot", "lowe's"]

[enrich]
workers = 16
max_pages_per_site = 4
verify = true

[score]
tier_a = 60                  # fit (max 50) + intent
tier_b = 35

[score.points]
hiring = 10                  # careers / "now hiring" on the site
runs_ads = 6                 # Google Ads or Meta pixel on the site
review_growth = 10           # reviews up 10%+ since the previous scrape

# Extra signals read from website text. One question per signal.
[[score.keyword_signals]]
name = "maintenance_plans"
points = 8
any = ["maintenance plan", "maintenance agreement", "service agreement", "comfort club"]

[[score.keyword_signals]]
name = "commercial"
points = 6
any = ["commercial hvac", "commercial services", "commercial customers"]

[export]
dir = "exports"
